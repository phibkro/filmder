name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Stub for build-time env var; not a real token, but vite
          # needs the var to exist for the build to typecheck.
          VITE_API_READ_ACCESS_TOKEN: "Bearer ci-build-stub"
